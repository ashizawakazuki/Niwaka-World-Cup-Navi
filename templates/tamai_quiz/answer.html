<main class="quiz-page">
  <section class="quiz-card">
    <div class="tape"></div>
    <div class="paper-clip"></div>

    {if $is_correct}
    <p class="quiz-subtitle">
      正解！
    </p>
    <p class="answer-message">
      いい感じです！
    </p>
    {else}
    <p class="quiz-subtitle">
      不正解...
    </p>
    <p class="answer-message">
      正解は「{$correct_answer|escape}」でした！
    </p>
    {/if}

    {if $is_last_question}
    <a href="/index.php?action=/tamai_quiz/result" class="start-button answer-link">
      結果を見る
    </a>
    {else}
    <a href="/index.php?action=/tamai_quiz/question" class="start-button answer-link">
      次の問題へ
    </a>
    {/if}
  </section>
</main>
